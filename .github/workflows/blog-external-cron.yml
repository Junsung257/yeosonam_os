name: Blog External Cron

on:
  schedule:
    # KST 06:10, retry the primary trend miner before queue preparation.
    - cron: '10 21 * * *'
    # KST 06:40, retry Naver/Serp rank snapshots independently of Vercel Cron.
    - cron: '40 21 * * *'
    # KST 08:50, prepare researched candidates before the first publisher slot.
    - cron: '50 23 * * *'
    # KST 11:40, retry GSC page metrics and indexing inspection.
    - cron: '40 2 * * *'
    # KST 12:10, retry query-level GSC rank tracking.
    - cron: '10 3 * * *'
    # KST 01:07-06:07, off-peak generation/rewrite backup.
    - cron: '7 16,17,18,19,20,21 * * *'
    # KST 09:07, 12:07, 15:07, 18:07, 21:07, model-free publication backup.
    - cron: '7 0,3,6,9,12 * * *'
    # KST 09:27, 12:27, 15:27, 18:27, 21:27.
    - cron: '27 0,3,6,9,12 * * *'
    # KST 22:40, final indexing drain after late publisher retries.
    - cron: '40 13 * * *'
    # KST 21:50, seed at most two fail-closed published-article upgrades.
    - cron: '50 12 * * *'
    # KST 22:45, after the final publisher retries and indexing worker slots.
    - cron: '45 13 * * *'
  workflow_dispatch:
    inputs:
      endpoint:
        description: Cron endpoint to trigger.
        required: true
        type: choice
        default: blog-publisher
        options:
          - blog-scheduler
          - blog-publisher
          - blog-generate
          - blog-publication-controller
          - blog-indexing-worker
          - blog-daily-summary
          - trend-topic-miner
          - serp-rank-snapshot
          - gsc-index-rank
          - rank-tracking
          - blog-regenerate-zero-click
      force:
        description: Add force=true for manual publisher checks.
        required: true
        type: boolean
        default: false
      private_queue_id:
        description: Optional queued private-regeneration UUID. Processes only this row.
        required: false
        type: string
        default: ''
      target_queue_id:
        description: Optional controlled-canary UUID. Allowed only with blog-generate.
        required: false
        type: string
        default: ''
      target_run_id:
        description: Optional approved run UUID. Allowed only with blog-publication-controller.
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: blog-external-cron-${{ github.event_name }}-${{ github.event.schedule || github.event.inputs.endpoint || 'manual' }}
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: https://www.yeosonam.com
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Select endpoint
        id: select
        shell: bash
        run: |
          set -euo pipefail

          endpoint="${{ github.event.inputs.endpoint || '' }}"
          force="${{ github.event.inputs.force || 'false' }}"
          private_queue_id="${{ github.event.inputs.private_queue_id || '' }}"
          target_queue_id="${{ github.event.inputs.target_queue_id || '' }}"
          target_run_id="${{ github.event.inputs.target_run_id || '' }}"

          if [ -z "$endpoint" ]; then
            case "${{ github.event.schedule }}" in
              "10 21 * * *")
                endpoint="trend-topic-miner"
                ;;
              "40 21 * * *")
                endpoint="serp-rank-snapshot"
                ;;
              "40 2 * * *")
                endpoint="gsc-index-rank"
                ;;
              "10 3 * * *")
                endpoint="rank-tracking"
                ;;
              "50 23 * * *")
                endpoint="blog-scheduler"
                ;;
              "50 12 * * *")
                endpoint="blog-regenerate-zero-click"
                ;;
              "7 16,17,18,19,20,21 * * *")
                endpoint="blog-generate"
                ;;
              "7 0,3,6,9,12 * * *")
                endpoint="blog-publication-controller"
                ;;
              "27 0,3,6,9,12 * * *"|"40 13 * * *")
                endpoint="blog-indexing-worker"
                ;;
              "45 13 * * *")
                endpoint="blog-daily-summary"
                ;;
              *)
                endpoint="blog-publication-controller"
                ;;
            esac
            if [ "$endpoint" != "blog-generate" ]; then
              force="true"
            fi
          fi

          query=""
          if [ -n "$private_queue_id" ]; then
            if [ "$endpoint" != "blog-publisher" ]; then
              echo "private_queue_id is allowed only with blog-publisher" >&2
              exit 1
            fi
            if [[ ! "$private_queue_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
              echo "private_queue_id must be a UUID" >&2
              exit 1
            fi
            force="true"
          fi
          if [ -n "$target_queue_id" ]; then
            if [ "$endpoint" != "blog-generate" ]; then
              echo "target_queue_id is allowed only with blog-generate" >&2
              exit 1
            fi
            if [[ ! "$target_queue_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
              echo "target_queue_id must be a UUID" >&2
              exit 1
            fi
            force="true"
          fi
          if [ -n "$target_run_id" ]; then
            if [ "$endpoint" != "blog-publication-controller" ]; then
              echo "target_run_id is allowed only with blog-publication-controller" >&2
              exit 1
            fi
            if [[ ! "$target_run_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
              echo "target_run_id must be a UUID" >&2
              exit 1
            fi
            force="true"
          fi

          if [ "$force" = "true" ]; then
            query="?force=true"
          fi
          if [ -n "$private_queue_id" ]; then
            query="${query}&privateQueueId=${private_queue_id}"
          fi
          if [ -n "$target_queue_id" ]; then
            query="${query}&targetQueueId=${target_queue_id}"
          fi
          if [ -n "$target_run_id" ]; then
            query="${query}&runId=${target_run_id}"
          fi

          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
          echo "url=${BASE_URL}/api/cron/${endpoint}${query}" >> "$GITHUB_OUTPUT"

      - name: Trigger blog cron
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "Missing GitHub Actions secret: CRON_SECRET" >&2
            exit 1
          fi

          trigger_url() {
            local url="$1"
            local output="$2"
            curl \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-delay 10 \
              --max-time 540 \
              --output "${output}" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              "${url}"
          }

          endpoint="${{ steps.select.outputs.endpoint }}"
          if [ "$endpoint" = "blog-daily-summary" ]; then
            echo "Running one model-free publication pass before daily summary."
            pre_summary_publisher_output="pre-summary-publisher-response.json"
            publisher_code="$(trigger_url "${BASE_URL}/api/cron/blog-publication-controller?force=true" "${pre_summary_publisher_output}")"
            echo "Pre-summary publisher HTTP status: ${publisher_code}"
            cat "${pre_summary_publisher_output}"
            if [ "$publisher_code" -lt 200 ] || [ "$publisher_code" -ge 300 ]; then
              exit 1
            fi

            echo "Running pre-summary indexing drain before daily summary."
            indexing_code="$(trigger_url "${BASE_URL}/api/cron/blog-indexing-worker?force=true" "pre-summary-indexing-response.json")"
            echo "Pre-summary indexing HTTP status: ${indexing_code}"
            cat pre-summary-indexing-response.json
            if [ "$indexing_code" -lt 200 ] || [ "$indexing_code" -ge 300 ]; then
              exit 1
            fi
            node <<'NODE'
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('pre-summary-indexing-response.json', 'utf8'));
            const failed = Number(data?.failed ?? 0);
            const errors = Array.isArray(data?.errors) ? data.errors : [];
            if (failed > 0 || errors.length > 0) {
              console.error(`Pre-summary indexing drain reported failures. failed=${failed}, errors=${JSON.stringify(errors)}`);
              process.exit(1);
            }
          NODE
            node <<'NODE'
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('pre-summary-publisher-response.json', 'utf8'));
            if (data?.ok === false) {
              console.error('Pre-summary publisher returned ok=false');
              process.exit(1);
            }
            if (!data?.skipped && Number(data?.modelCalls ?? -1) !== 0) {
              console.error(`Publication controller must make zero model calls: ${data?.modelCalls}`);
              process.exit(1);
            }
          NODE
          fi

          http_code="$(trigger_url "${{ steps.select.outputs.url }}" response.json)"

          echo "Endpoint: ${{ steps.select.outputs.endpoint }}"
          echo "HTTP status: ${http_code}"
          cat response.json

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const body = fs.readFileSync('response.json', 'utf8');
          const data = JSON.parse(body);
          const endpoint = '${{ steps.select.outputs.endpoint }}';
          if (data?.ok === false) {
            console.error('Cron endpoint returned ok=false');
            process.exit(1);
          }
          if (data?.skipped && data?.reason === 'db_resource_saver_mode') {
            console.error('Critical blog cron was skipped by DB resource saver mode');
            process.exit(1);
          }
          if (
            ['serp-rank-snapshot', 'gsc-index-rank', 'rank-tracking'].includes(endpoint)
            && Array.isArray(data?.errors)
            && data.errors.length > 0
          ) {
            console.error(`${endpoint} reported data collection errors: ${JSON.stringify(data.errors)}`);
            process.exit(1);
          }
          if (endpoint === 'blog-publication-controller') {
            if (!data?.skipped && Number(data?.modelCalls ?? -1) !== 0) {
              console.error(`Publication controller must make zero model calls: ${data?.modelCalls}`);
              process.exit(1);
            }
            const quarantined = Array.isArray(data?.results)
              ? data.results.filter((row) => row?.status === 'quarantined')
              : [];
            if (quarantined.length > 0) {
              console.error(`Publication controller quarantined ${quarantined.length} run(s): ${JSON.stringify(quarantined)}`);
              process.exit(1);
            }
          }
          if (endpoint === 'blog-indexing-worker') {
            const failed = Number(data?.failed ?? 0);
            const errors = Array.isArray(data?.errors) ? data.errors : [];
            if (failed > 0 || errors.length > 0) {
              console.error(`Indexing worker reported failures. failed=${failed}, errors=${JSON.stringify(errors)}`);
              process.exit(1);
            }
          }
          NODE
