name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks first (type safety, linting)
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: npm audit (high severity)
        run: npm run audit:high

      - name: Secret usage lint
        run: npm run lint:secrets:all

      - name: Verify CI actions are immutable
        run: npm run verify:ci-action-pins

      - name: Audit automation runtime ownership
        run: npm run audit:automation-runtime:ci

      - name: Block new untraced direct LLM calls
        run: npm run audit:llm-telemetry:ci

      - name: Verify isolated research node package
        working-directory: tools/research-node
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm test

      - name: Verify external API contract artifacts
        run: npm run verify:openapi:v1

      - name: Install Gitleaks CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          gh release download v8.28.0 \
            --repo gitleaks/gitleaks \
            --pattern gitleaks_8.28.0_linux_x64.tar.gz \
            --dir "$RUNNER_TEMP/gitleaks"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks/gitleaks_8.28.0_linux_x64.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks/gitleaks_8.28.0_linux_x64.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Block newly committed secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            LOG_OPTS="-1 $HEAD_SHA"
          else
            LOG_OPTS="$BASE_SHA..$HEAD_SHA"
          fi
          gitleaks git . \
            --log-opts="$LOG_OPTS" \
            --redact=100 \
            --no-banner

      - name: Sensitive API guard audit
        run: npm run audit:sensitive-api-guards

      - name: Marketing automation readiness
        run: npm run verify:marketing-automation:ci

      - name: TypeScript strict check
        run: npx tsc --strict --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: ESLint
        run: npm run lint

      - name: a11y lint (jsx-a11y strict)
        run: npx eslint src --no-eslintrc --config eslint-a11y.config.js --format=compact 2>&1 || true

      - name: Type coverage
        run: node scripts/check-type-coverage.js

  # Build & test
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # CI build env — dummy 값 (실제 fetch 안 함, supabase client constructor 통과용)
      # pr-quality-gate.yml 과 동일 패턴 (2026-05-15 박제). 실 secrets 는 Vercel 환경에서만 노출.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-for-ci"
          SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key-for-ci"
          NEXT_PUBLIC_BASE_URL: "https://example.com"
          # The required quality job already ran tsc --noEmit.
          NEXT_BUILD_SKIP_TYPECHECK: "1"

      # Visual regression 은 dummy supabase env 라 실제 데이터 fetch 못 함 → continue-on-error.
      # Vercel Preview 환경에서는 real secrets 라 정상 검증. CI 빌드 통과만 보장. (2026-05-15 박제)
      - name: Visual regression tests
        continue-on-error: true
        timeout-minutes: 8
        run: npx playwright install && npm run test:visual
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-for-ci"
          SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key-for-ci"
          NEXT_PUBLIC_BASE_URL: "https://example.com"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/

  # Performance checks (parallel)
  performance:
    name: Performance Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci && npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-for-ci"
          SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key-for-ci"
          NEXT_PUBLIC_BASE_URL: "https://example.com"
          # Performance analysis needs production output, not a duplicate tsc.
          NEXT_BUILD_SKIP_TYPECHECK: "1"

      - name: Lighthouse CI
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-for-ci"
          SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key-for-ci"
          NEXT_PUBLIC_BASE_URL: "http://127.0.0.1:3000"
        run: |
          mkdir -p .tmp
          npm run start -- -p 3000 > .tmp/lighthouse-next-start.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:3000/api/v1/health >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat .tmp/lighthouse-next-start.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != "1" ]; then
            cat .tmp/lighthouse-next-start.log
            exit 1
          fi

          npm install -g @lhci/cli@latest
          if ! lhci autorun; then
            echo "::warning::Lighthouse CI reported performance findings. This workflow treats them as advisory; release gates are covered by build, test, and readiness jobs."
          fi

      - name: Bundle analysis
        continue-on-error: true
        run: |
          if [ -d .next ]; then
            SIZE=$(du -sh .next | cut -f1)
            echo "Next.js build size: $SIZE"
          elif [ -d build ]; then
            SIZE=$(du -sh build | cut -f1)
            echo "Build size: $SIZE"
          else
            echo "::warning::No .next or build directory found for bundle analysis."
          fi

  # Security checks
  # 2026-05-15 — mail-flood-stop v4 고정:
  #   - codeql-action v2 deprecated → v4
  #   - security-events: write 권한 명시 (SARIF 업로드)
  #   - Trivy 스캔/업로드 둘 다 continue-on-error — 보안 스캔이 CI 통과 자체를 막지 않도록
  #     (status job에서 quality/build만 가드. security는 정보성)
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: OSV dependency scan
        continue-on-error: true
        uses: docker://ghcr.io/google/osv-scanner-action@sha256:dcd947131d8d11b8d0964de6590661fb921a4ecbd7b90a7cb21083acfc3fd8cc # v2.5.1
        with:
          args: >-
            --format=sarif
            --output=osv-results.sarif
            --lockfile=package-lock.json

      - name: Upload Trivy results to GitHub Security
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-filesystem"

      - name: Upload OSV results to GitHub Security
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: "osv-results.sarif"
          category: "osv-lockfile"

  # Final status check
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [quality, build, performance, security]
    if: always()

    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.quality.result }}" == "failure" ||
                "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ CI failed"
            exit 1
          fi
          echo "✅ All critical checks passed"
