name: Blog V4 Required

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-v4-required-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blog-v4:
    name: Blog V4 targeted contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Blog V4 scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          changed="$(git diff --name-only "$base" "$GITHUB_SHA" 2>/dev/null || true)"
          if printf '%s\n' "$changed" | grep -Eiq '^(src/(app|components|lib)/.*blog|src/lib/ai-control-plane|src/lib/blog-ai-control-plane-v4|src/workflows/.*blog|src/generated/blog-build-provenance|scripts/.*blog|scripts/(generate-blog-build-provenance|verify-blog-|verify-ai-control-plane|verify-ai-direct-call)|supabase/(migrations|rollbacks)/.*(blog|ai_control_plane)|supabase/release-manifests/(blog-|ai-control-plane-)|package(-lock)?\.json$|next\.config\.js$|vitest\.config\.ts$|vercel\.json$|\.github/workflows/blog-v4-)'; then
            echo "blog_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "blog_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: No Blog V4 changes
        if: steps.scope.outputs.blog_changed != 'true'
        run: echo "No Blog V4 changes in this revision; required lane passes explicitly."
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.blog_changed == 'true'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.scope.outputs.blog_changed == 'true'
      - name: Verify release bundle
        if: steps.scope.outputs.blog_changed == 'true'
        run: |
          npm run verify:blog-release-bundle-v4
          npm run verify:blog-content-factory-release-bundle-v4
      - name: Verify content factory dry-run output contract
        if: steps.scope.outputs.blog_changed == 'true'
        shell: bash
        run: |
          mkdir -p .tmp/blog-v4-required
          printf 'Applying migration 20260819073009_blog_v4_content_factory.sql\nApplying migration 20260820100000_blog_publication_rollout_manual_transition_v1.sql\nApplying migration 20260820113000_blog_publication_rollout_inventory_gate_v1.sql\n' > .tmp/blog-v4-required/supabase-dry-run.txt
          npm run verify:blog-content-factory-supabase-dry-run-v4 -- --input=.tmp/blog-v4-required/supabase-dry-run.txt
          npm run verify:ai-control-plane-migration
          npm run verify:blog-auto-repair-migration
          npm run verify:ai-direct-call-guard
      - name: Type check
        if: steps.scope.outputs.blog_changed == 'true'
        run: npm run type-check
      - name: Blog V4 unit and contract tests
        if: steps.scope.outputs.blog_changed == 'true'
        run: |
          npx vitest run \
            src/lib/blog-ai-caller.test.ts \
            src/lib/blog-ai-budget-v4.test.ts \
            src/lib/blog-autopublish-policy-v3.test.ts \
            src/lib/blog-autopublish-activation-v4.test.ts \
            src/lib/blog-deepseek-orchestrator-v4.test.ts \
            src/lib/blog-deepseek-orchestrator-v4-migration.test.ts \
            src/lib/blog-generation-run-v4.test.ts \
            src/lib/blog-production-readiness-v4.test.ts \
            src/lib/blog-release-candidate-responses-v4.test.ts \
            src/lib/blog-production-release-workflow.test.ts \
            src/lib/blog-publication-rollout-manual-transition-migration.test.ts \
            src/lib/blog-publication-rollout-inventory-gate-migration.test.ts \
            src/lib/blog-publication-rollout-transition-script.test.ts \
            src/lib/blog-ops-readiness-auth.test.ts \
            src/lib/blog-v4-required-workflow.test.ts \
            src/lib/blog-publisher-v4-orchestration-contract.test.ts \
            src/lib/blog-publication-rollout.test.ts \
            src/lib/blog-publication-rollout-repository.test.ts \
            src/lib/blog-publish-slot-quota.test.ts \
            src/lib/blog-content-factory \
            src/lib/blog-content-factory-release-bundle.test.ts \
            src/lib/ai-control-plane \
            src/lib/llm-gateway-timeout.test.ts \
            src/lib/blog-ops-summary.test.ts \
            src/workflows/blog-content-operation-v4.contract.test.ts \
            src/app/api/cron/blog-publication-controller/route.test.ts \
            src/lib/blog-public-eligibility.test.ts \
            src/lib/blog-public-eligibility-contract-v3.test.ts \
            src/app/sitemap.test.ts \
            src/app/blog/image-sitemap.xml/route.test.ts \
            src/lib/blog-indexing-worker.test.ts \
            src/app/[indexnowKey]/route.test.ts \
            src/app/api/cron/blog-data-readiness/route.contract.test.ts
      - name: Blog V4 lint
        if: steps.scope.outputs.blog_changed == 'true'
        run: |
          npx eslint \
            src/lib/blog-content-factory \
            src/lib/ai-control-plane \
            src/lib/blog-ai-control-plane-v4.ts \
            src/lib/llm-gateway.ts \
            src/workflows/blog-content-operation-v4.ts \
            src/app/api/cron/blog-generate/route.ts \
            src/app/api/cron/blog-publisher/route.ts \
            src/app/api/cron/blog-publication-controller/route.ts \
            src/app/api/cron/blog-data-readiness/route.ts \
            src/lib/blog-indexing-worker.ts \
            src/lib/blog-publication-rollout.ts \
            scripts/transition-blog-publication-rollout-v4.ts \
            src/lib/blog-ops-summary.ts \
            src/app/admin/blog/system/page.tsx
      - name: Linux production build
        if: steps.scope.outputs.blog_changed == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'https://example.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'dummy-anon-key-for-ci'
          SUPABASE_SERVICE_ROLE_KEY: 'dummy-service-role-key-for-ci'
          NEXT_PUBLIC_BASE_URL: 'https://example.com'
          NEXT_SKIP_TYPESCRIPT_CHECK: '1'
          # Do not spend the default 15 minutes waiting for a failed Next
          # process to produce a verified artifact; surface the real Linux
          # build error within the required-lane timeout.
          NEXT_BUILD_RECOVERY_WAIT_MS: '30000'
      - name: Verify generated provenance fallback is deterministic
        if: steps.scope.outputs.blog_changed == 'true'
        run: |
          node scripts/generate-blog-build-provenance.mjs
          git diff --exit-code -- src/generated/blog-build-provenance.server.ts
      - name: Diff check
        if: steps.scope.outputs.blog_changed == 'true'
        run: git diff --check
