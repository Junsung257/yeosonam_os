name: Concierge Promptfoo Challenger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Run zero-cost Promptfoo challenger
        run: npm run eval:concierge:promptfoo
