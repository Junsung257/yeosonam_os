name: Concierge Eval Gate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run Concierge Eval
        env:
          CONCIERGE_EVAL_THRESHOLD: '0.95'
        run: npm run eval:concierge
